<div class="w-full max-w-4xl">
  <div class="bg-white rounded-full shadow-lg border-2 p-1 transition-all duration-300"
  [class.border-red-300]="citySelected() == ''"
  [class.shadow-red-200]="citySelected() == ''">
    <div class="flex items-center">
      
      <!-- Destination section -->
      <div class="relative flex-1 px-4 py-3 hover:bg-gray-50 rounded-full transition-colors">
        <div class="flex flex-col">
          <label class="text-xs font-semibold text-gray-900">
            Destination
          </label>
          <input
            [(ngModel)]="citySelected"
            placeholder="Rechercher une destination"
            class="text-sm text-gray-500 bg-transparent border-none outline-none placeholder-gray-400 w-full mt-0.5"
          />
          <app-autocomplete
            [valueSelected]="citySelected()"
            (handleSelectCity)="listenCityChange($event)"
          />
        </div>
      </div>

      <!-- Divider -->
      <div class="w-px h-8 bg-gray-200"></div>

      <!-- Check-in section -->
      <div class="flex-1 px-4 py-3 hover:bg-gray-50 rounded-full transition-colors">
        <div class="flex flex-col">
          <label class="text-xs font-semibold text-gray-900">
            Arrivée
          </label>
          <input
            type="date"
            [(ngModel)]="arrivalSelected"
            placeholder="Quand ?"
            class="text-sm text-gray-500 bg-transparent border-none outline-none w-full mt-0.5"
          />
        </div>
      </div>

      <!-- Divider -->
      <div class="w-px h-8 bg-gray-200"></div>

      <!-- Check-out section -->
      <div class="flex-1 px-4 py-3 hover:bg-gray-50 rounded-full transition-colors">
        <div class="flex flex-col">
          <label class="text-xs font-semibold text-gray-900">
            Départ
          </label>
          <input
            type="date"
            [(ngModel)]="departureSelected"
            placeholder="Quand ?"
            class="text-sm text-gray-500 bg-transparent border-none outline-none w-full mt-0.5"
          />
        </div>
      </div>

      <!-- Divider -->
      <div class="w-px h-8 bg-gray-200"></div>

      <!-- Guests section -->
      <div class="flex-1 px-4 py-3 hover:bg-gray-50 rounded-full transition-colors">
        <div class="flex flex-col">
          <label class="text-xs font-semibold text-gray-900">
            Voyageurs
          </label>
          <input
            type="number"
            [(ngModel)]="guestsSelected"
            placeholder="Ajouter des invités"
            min="1"
            max="10"
            class="text-sm text-gray-500 bg-transparent border-none outline-none w-full mt-0.5"
          />
        </div>
      </div>

      <!-- Search button -->
      <div class="flex items-center justify-center p-2">
        <button
          (click)="search()"
          class="bg-rose-500 hover:bg-rose-600 text-white p-3 rounded-full transition-colors duration-200 flex items-center justify-center cursor-pointer focus:outline-2 focus:outline-rose-500 focus:outline-offset-2"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </button>
      </div>

    </div>
  </div>
</div>
