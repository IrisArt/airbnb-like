<div>
    @if (valueSelected().length >= 3) {
        <div class="absolute top-full left-0 right-0 bg-white border border-gray-300 rounded-lg shadow-lg mt-1 z-10 max-h-60 overflow-y-auto">
            <ul class="py-1">
                @for (city of citiesFiltered() ; track $index) {
                    <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer text-gray-800 border-b border-gray-100" (click)="selectCity(city)">
                        <div class="flex items-center">
                            <svg class="w-4 h-4 mr-2 text-gray-500" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path>
                            </svg>
                            <span class="font-medium">{{ city.name }}</span>
                            <span class="ml-2 text-sm text-gray-500">{{ city.region }}</span>
                        </div>
                    </li>
                }
                @empty {
                    <li>Aucune destination</li>
                }
            </ul>
         </div>
    }
    
</div>
