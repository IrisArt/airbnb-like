<main class="min-h-screen flex flex-col items-center justify-center px-4 mt-16">
    <h1 class="text-5xl md:text-4xl font-bold text-center mb-8 text-gray-800">
      Trouvez un logement !
    </h1>

    <!-- Search component -->
    <app-search />

    <!-- Results Section - Using PropertyList component -->
    <div class="w-full max-w-7xl mt-16 md:mt-8 md:p-4 md:justify-start md:pt-8">
      <div class="bg-white/90 backdrop-blur-sm rounded-2xl p-8 mt-8 scroll-mt-8">
        <h2 class="text-2xl md:text-xl font-bold text-gray-800 mb-8">Logements disponibles</h2>
        
        <!-- PropertyList component with ng-content demonstration -->
        <div class="md:grid-cols-1 md:gap-4">
          <app-property-list [properties]="properties()"></app-property-list>
        </div>
      </div>
    </div>

    <!-- Carte simple -->
    <div class="w-full max-w-4xl mt-8">
        <app-map />
    </div>
  </main>
